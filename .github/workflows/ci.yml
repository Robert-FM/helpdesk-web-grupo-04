
name: HelpDesk - Validacao

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn -B verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-java
          path: target/surefire-reports/

  navegador:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: mvn -B -DskipTests package

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-navegador
          path: |
            playwright-report/
            test-results/
