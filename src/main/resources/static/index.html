<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelpDesk Web</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body>
<header><div class="wrap"><span class="brand">WebSolutions / TI</span><h1>HelpDesk Web</h1><p>Central de chamados técnicos</p></div></header><main class="wrap">
<section aria-label="Indicadores" class="cards"><article>Total <strong id="total">—</strong></article><article>Abertos <strong id="abertos">—</strong></article><article>Resolvidos <strong id="resolvidos">—</strong></article><article>Alta prioridade <strong id="alta">—</strong></article></section>
<section class="panel"><h2>Abrir chamado</h2><form id="form-chamado"><div class="fields"><label>Solicitante<input id="solicitante" name="solicitante" required></label><label>Categoria<select id="categoria" name="categoria"><option>HARDWARE</option><option>REDE</option><option>SOFTWARE</option></select></label><label>Prioridade<select id="prioridade" name="prioridade"><option>BAIXA</option><option>MEDIA</option><option>ALTA</option></select></label></div><label>Descrição<textarea id="descricao" name="descricao" required></textarea></label><button type="submit">Abrir chamado</button></form><p id="mensagem" role="status" aria-live="polite"></p></section>
<section class="panel"><div class="toolbar"><h2>Chamados registrados</h2><label>Filtrar status<select id="filtro"><option value="">Todos</option><option>ABERTO</option><option>RESOLVIDO</option></select></label></div><p id="lista-erro" role="status"></p><div class="table-wrap"><table><thead><tr><th scope="col">ID</th><th scope="col">Solicitante</th><th scope="col">Descrição</th><th scope="col">Prioridade</th><th scope="col">Status</th><th scope="col">Ações</th></tr></thead><tbody id="lista"></tbody></table></div></section><footer>Ambiente didático · Dados em memória</footer></main></body></html>
